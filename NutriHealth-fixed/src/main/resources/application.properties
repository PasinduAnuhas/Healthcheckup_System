server.port=8080
spring.application.name=NutriHealth

# Database Configuration (H2 in-memory default with instant fallback; MySQL supported via DB_URL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:nutrihealth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=root
spring.datasource.password=Chamikara@1234
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Security & Session
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=true

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.nutrihealth=INFO
