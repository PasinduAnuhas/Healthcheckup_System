<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Messages – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('messages')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Communications</span>
                    <h1 class="page-title">Secure Telehealth Messaging</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">Message sent!</span>
            </div>

            <div class="dashboard-grid-2">
                <!-- Compose Message -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-paper-plane text-primary"></i> Contact Care Team</h3>
                    </div>
                    <div class="panel-card-body">
                        <form th:action="@{/patient/messages}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="form-group">
                                <label>Recipient (Doctor / Nutritionist / Care Coordinator)</label>
                                <select name="recipientId" class="form-control" required>
                                    <option value="">-- Choose Specialist --</option>
                                    <option th:each="p : ${providers}" th:value="${p.id}" th:text="${p.fullName + ' (' + p.role + ')'}">
                                        Dr. Eleanor Vance (ROLE_DOCTOR)
                                    </option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Subject</label>
                                <input type="text" name="subject" class="form-control" placeholder="e.g. Question regarding dietary plan fats" required>
                            </div>

                            <div class="form-group">
                                <label>Message Inquiry</label>
                                <textarea name="content" class="form-control" rows="4" placeholder="Detail your clinical or dietary question..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> Send Secure Message
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Inbox & Sent Tabs -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-inbox text-success"></i> Clinical Communications</h3>
                    </div>
                    <div class="panel-card-body">
                        <h4 style="font-size: 14px; text-transform: uppercase; color: #64748b; margin-bottom: 12px;">Received Messages</h4>
                        <div th:if="${inbox != null and !inbox.isEmpty()}">
                            <div th:each="m : ${inbox}" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 12px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <strong style="color: #0284c7;" th:text="${m.sender != null ? m.sender.fullName : 'Care Specialist'}">Doctor</strong>
                                    <span style="font-size: 12px; color: #94a3b8;" th:text="${m.sentAt}">2026-09-16 10:00</span>
                                </div>
                                <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;" th:text="${m.subject}">Subject</div>
                                <p style="font-size: 13px; color: #475569; margin: 0;" th:text="${m.content}">Content text</p>
                            </div>
                        </div>
                        <div class="empty-state text-center" th:if="${inbox == null or inbox.isEmpty()}">
                            <p class="text-muted">No messages in inbox.</p>
                        </div>

                        <h4 style="font-size: 14px; text-transform: uppercase; color: #64748b; margin-top: 24px; margin-bottom: 12px;">Sent Messages</h4>
                        <div th:if="${sent != null and !sent.isEmpty()}">
                            <div th:each="sm : ${sent}" style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 12px;">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                                    <span>To: <strong th:text="${sm.recipient != null ? sm.recipient.fullName : 'Care Specialist'}">Provider</strong></span>
                                    <span style="font-size: 12px; color: #94a3b8;" th:text="${sm.sentAt}">2026-09-16 10:00</span>
                                </div>
                                <div style="font-weight: 600; font-size: 14px; margin-bottom: 4px;" th:text="${sm.subject}">Subject</div>
                                <p style="font-size: 13px; color: #475569; margin: 0;" th:text="${sm.content}">Content text</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
