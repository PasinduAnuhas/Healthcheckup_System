<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Consultations</span>
                    <h1 class="page-title">Consultation Scheduling &amp; Appointments</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">Appointment scheduled!</span>
            </div>

            <div class="dashboard-grid-2">
                <!-- Book New Appointment Form -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-calendar-plus text-primary"></i> Book Clinical Session</h3>
                    </div>
                    <div class="panel-card-body">
                        <form th:action="@{/patient/appointments}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="form-group">
                                <label>Session Type</label>
                                <select name="type" class="form-control" required id="sessionTypeSelect" onchange="toggleSpecialistSelect()">
                                    <option value="CHECKUP">General Health Check-up (Doctor)</option>
                                    <option value="DIET_CONSULTATION">Dietary Regimen Consultation (Nutritionist)</option>
                                    <option value="FOLLOWUP">Clinical Follow-up</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <div class="form-group" id="doctorGroup">
                                    <label>Attending Physician (Optional / Auto-assign)</label>
                                    <select name="doctorId" class="form-control">
                                        <option value="">-- First Available Doctor --</option>
                                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr. Smith</option>
                                    </select>
                                </div>
                                <div class="form-group" id="nutritionistGroup">
                                    <label>Clinical Nutritionist (Optional / Auto-assign)</label>
                                    <select name="nutritionistId" class="form-control">
                                        <option value="">-- First Available Nutritionist --</option>
                                        <option th:each="n : ${nutritionists}" th:value="${n.id}" th:text="${n.fullName}">Lisa Vance, RD</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Requested Date</label>
                                    <input type="date" name="appointmentDate" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Preferred Time Slot</label>
                                    <select name="appointmentTime" class="form-control" required>
                                        <option value="09:00 AM">09:00 AM</option>
                                        <option value="10:00 AM">10:00 AM</option>
                                        <option value="11:30 AM">11:30 AM</option>
                                        <option value="02:00 PM">02:00 PM</option>
                                        <option value="03:30 PM">03:30 PM</option>
                                        <option value="04:30 PM">04:30 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Reason for Visit / Primary Symptoms</label>
                                <textarea name="reason" class="form-control" rows="3" placeholder="Describe symptoms, dietary adjustments desired, or routine check-up request..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary" style="margin-top: 10px;">
                                <i class="fas fa-check"></i> Submit Appointment Request
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Upcoming & Historical Appointments List -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-clock text-success"></i> Your Scheduled Consultations</h3>
                    </div>
                    <div class="panel-card-body">
                        <div class="appointment-mini-list" th:if="${appointments != null and !appointments.isEmpty()}">
                            <div th:each="apt : ${appointments}" class="apt-mini-card" style="margin-bottom: 16px; padding: 14px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div>
                                        <span class="badge badge-info" th:text="${apt.type}">CHECKUP</span>
                                        <h4 style="margin: 6px 0 4px 0; font-size: 15px;" th:if="${apt.doctor != null}">Dr. <span th:text="${apt.doctor.fullName}">Doctor</span></h4>
                                        <h4 style="margin: 6px 0 4px 0; font-size: 15px;" th:if="${apt.nutritionist != null}">Nutritionist <span th:text="${apt.nutritionist.fullName}">Nutritionist</span></h4>
                                        <div style="font-size: 13px; color: #64748b;">
                                            <i class="fas fa-calendar"></i> <strong th:text="${apt.appointmentDate}">2026-09-18</strong> at <strong th:text="${apt.appointmentTime}">10:00 AM</strong>
                                        </div>
                                        <p style="font-size: 13px; color: #475569; margin: 6px 0 0 0;" th:text="${apt.reason}">Reason details</p>
                                    </div>
                                    <div style="text-align: right;">
                                        <span class="status-badge" th:classappend="${apt.status == 'CONFIRMED' ? 'confirmed' : (apt.status == 'PENDING' ? 'pending' : (apt.status == 'COMPLETED' ? 'completed' : 'cancelled'))}" th:text="${apt.status}">CONFIRMED</span>
                                        <div style="margin-top: 12px;" th:if="${apt.status != 'COMPLETED'}">
                                            <details style="margin-bottom:6px;"><summary class="btn btn-secondary btn-xs">Edit</summary>
                                                <form th:action="@{'/patient/appointments/' + ${apt.id} + '/update'}" method="post" style="margin-top:8px;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="date" name="appointmentDate" class="form-control" th:value="${apt.appointmentDate}" required><input name="appointmentTime" class="form-control" th:value="${apt.appointmentTime}" required><input name="type" class="form-control" th:value="${apt.type}" required><textarea name="reason" class="form-control" rows="2" th:text="${apt.reason}" required></textarea><textarea name="notes" class="form-control" rows="2" th:text="${apt.notes}"></textarea><button type="submit" class="btn btn-primary btn-xs">Save</button></form>
                                            </details>
                                            <form th:action="@{'/patient/appointments/' + ${apt.id} + '/cancel'}" method="post" onsubmit="return confirm('Cancel this appointment?');">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button type="submit" class="btn btn-outline btn-xs text-danger" style="border-color: #fca5a5;">Cancel</button>
                                            </form>
                                            <form th:action="@{'/patient/appointments/' + ${apt.id} + '/delete'}" method="post" style="margin-top:5px;" onsubmit="return confirm('Delete this appointment permanently?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-danger btn-xs">Delete</button></form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="empty-state text-center" th:if="${appointments == null or appointments.isEmpty()}">
                            <i class="fas fa-calendar-times empty-icon"></i>
                            <p class="text-muted">No appointments scheduled.</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
