<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Notifications – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('notifications')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Patient Alerts</span>
                    <h1 class="page-title">Notifications &amp; Reminders</h1>
                </div>
                <div class="header-actions">
                    <form th:action="@{/patient/notifications/read-all}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit" class="btn btn-outline btn-sm"><i class="fas fa-check-double"></i> Mark All as Read</button>
                    </form>
                </div>
            </div>

            <div th:if="${successMessage != null}" class="alert alert-success" style="max-width: 800px; margin-bottom: 16px;" th:text="${successMessage}"></div>
            <div th:if="${errorMessage != null}" class="alert alert-error" style="max-width: 800px; margin-bottom: 16px;" th:text="${errorMessage}"></div>

            <div class="panel-card" style="max-width: 800px;">
                <div class="panel-card-body">
                    <div th:if="${notifications != null and !notifications.isEmpty()}">
                        <div th:each="n : ${notifications}" style="display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #e2e8f0;"
                             th:styleappend="${!n.isRead} ? 'background: #f0f9ff; border-left: 4px solid #0284c7;' : ''">
                            <div>
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
                                    <span class="badge badge-info" th:text="${n.type}">ALERT</span>
                                    <strong style="color: #0f172a;" th:text="${n.title}">Notification Title</strong>
                                    <span th:if="${!n.isRead}" class="status-badge pending" style="font-size: 10px;">NEW</span>
                                </div>
                                <p style="margin: 0; font-size: 13px; color: #475569;" th:text="${n.message}">Message content details</p>
                                <span style="font-size: 11px; color: #94a3b8;" th:text="${n.createdAt}">2026-09-16 10:00</span>
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <a th:if="${n.linkUrl != null and !#strings.isEmpty(n.linkUrl)}" th:href="${n.linkUrl}" class="btn btn-outline btn-xs">View</a>
                                <form th:if="${!n.isRead}" th:action="@{'/patient/notifications/' + ${n.id} + '/read'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn btn-secondary btn-xs" title="Mark as read"><i class="fas fa-check"></i> Mark as read</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="empty-state text-center" th:if="${notifications == null or notifications.isEmpty()}">
                        <i class="fas fa-bell-slash empty-icon"></i>
                        <p class="text-muted">No notifications at this time.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
