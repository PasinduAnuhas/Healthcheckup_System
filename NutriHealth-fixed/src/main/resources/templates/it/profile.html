<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Operations Profile – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Systems Clearance</span>
                    <h1 class="page-title">IT Operations Officer Profile</h1>
                </div>
            </div>

            <div class="panel-card" style="max-width: 700px;">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-terminal text-primary"></i> Operator Profile</h3>
                </div>
                <div class="panel-card-body">
                    <div class="form-group">
                        <label>Officer Legal Name</label>
                        <input type="text" class="form-control" th:value="${itOfficer.fullName}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Security / Ops Email</label>
                        <input type="email" class="form-control" th:value="${itOfficer.email}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Contact Extension</label>
                        <input type="text" class="form-control" th:value="${itOfficer.phone != null ? itOfficer.phone : '+1 (555) 019-9900'}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Security Clearance Level</label>
                        <input type="text" class="form-control" value="ROLE_IT_OPERATIONS_OFFICER (Level 5 Infrastructure Clearance)" disabled>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
