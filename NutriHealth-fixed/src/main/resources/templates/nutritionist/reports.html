<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutritionist Reports – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('reports')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Documentation</span>
                    <h1 class="page-title">Dietary Records &amp; Patient Dossiers</h1>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-file-medical text-primary"></i> Patient Caseload Dossiers</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Patient</th>
                                    <th>Weight / Target</th>
                                    <th>BMI</th>
                                    <th>Official Dossier</th>
                                    <th>CSV Export</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${patients}">
                                    <td>
                                        <strong th:text="${p.user.fullName}">Eleanor Vance</strong><br>
                                        <small class="text-muted" th:text="${p.user.email}">email</small>
                                    </td>
                                    <td><span th:text="${p.currentWeightKg}">72.0</span> kg &bull; Goal: <span th:text="${p.targetWeightKg != null ? p.targetWeightKg : 68.0}">68.0</span> kg</td>
                                    <td><strong th:text="${p.bmi != null ? p.bmi : '23.5'}">23.5</strong></td>
                                    <td>
                                        <a th:href="@{'/reports/patient/' + ${p.user.id} + '/summary'}" class="btn btn-primary btn-xs" target="_blank">
                                            <i class="fas fa-print"></i> Health Dossier
                                        </a>
                                    </td>
                                    <td>
                                        <a th:href="@{'/reports/patient/' + ${p.user.id} + '/export-csv'}" class="btn btn-outline btn-xs">
                                            <i class="fas fa-file-csv"></i> Download CSV
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${patients == null or patients.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">No patient records found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
