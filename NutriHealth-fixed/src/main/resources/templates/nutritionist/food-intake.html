<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Intake Review – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('food-intake')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Dietetics Review</span>
                    <h1 class="page-title">Patient Food Intake Audit</h1>
                </div>
                <div class="header-actions">
                    <form th:action="@{/nutritionist/food-intake}" method="get" style="display: flex; gap: 8px; align-items: center;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <label class="text-sm">Select Patient:</label>
                        <select name="patientId" class="form-control" style="width: auto; padding: 4px 8px; font-size: 13px;" onchange="this.form.submit()">
                            <option th:each="p : ${patients}"
                                    th:value="${p.user.id}"
                                    th:selected="${p.user.id == selectedPatientId}"
                                    th:text="${p.user.fullName}">Patient</option>
                        </select>
                    </form>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-utensils text-primary"></i> Intake Log for Selected Patient</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Meal Type</th>
                                    <th>Food Item &amp; Serving</th>
                                    <th>Calories</th>
                                    <th>Macronutrient Split (P/C/F)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${intakes}">
                                    <td><strong th:text="${item.logDate}">2026-09-16</strong></td>
                                    <td><span class="badge badge-info" th:text="${item.mealType}">LUNCH</span></td>
                                    <td>
                                        <strong th:text="${item.foodItem}">Grilled Chicken Salad</strong><br>
                                        <small class="text-muted" th:text="${item.quantity}">1 bowl</small>
                                    </td>
                                    <td><span class="calorie-num" th:text="${item.calories} + ' kcal'">450 kcal</span></td>
                                    <td>
                                        <small th:text="${item.proteinG + 'g protein &bull; ' + item.carbsG + 'g carbs &bull; ' + item.fatG + 'g fat'}">Macros</small>
                                    </td>
                                </tr>
                                <tr th:if="${intakes == null or intakes.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">No meal intake logs recorded for this patient.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
