<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Follow-ups &amp; Care Recalls – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('followups')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Continuity</span>
                    <h1 class="page-title">Upcoming Patient Follow-ups &amp; Recalls</h1>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-redo text-primary"></i> Pending Follow-up Sessions</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Patient</th>
                                    <th>Reason / Recall Objective</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="apt : ${followups}">
                                    <td>
                                        <strong th:text="${apt.appointmentDate}">2026-09-18</strong> &bull; <span th:text="${apt.appointmentTime}">10:00 AM</span>
                                    </td>
                                    <td>
                                        <strong th:text="${apt.patient.fullName}">Patient</strong><br>
                                        <small class="text-muted" th:text="${apt.patient.phone}">phone</small>
                                    </td>
                                    <td th:text="${apt.reason}">Post-diet review</td>
                                    <td><span class="status-badge" th:classappend="${apt.status == 'CONFIRMED' ? 'confirmed' : 'pending'}" th:text="${apt.status}">PENDING</span></td>
                                    <td>
                                        <a th:href="@{/coordinator/appointments}" class="btn btn-outline btn-xs">Manage Session</a>
                                    </td>
                                </tr>
                                <tr th:if="${followups == null or followups.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">No follow-ups pending.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
