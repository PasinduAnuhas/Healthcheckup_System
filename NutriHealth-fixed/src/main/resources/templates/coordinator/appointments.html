<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Coordination Appointments – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Logistics</span>
                    <h1 class="page-title">Appointment Master Schedule &amp; Intake</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">Success!</span>
            </div>

            <div class="dashboard-grid-2">
                <!-- Schedule Session Form -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-calendar-plus text-primary"></i> Dispatch New Appointment</h3>
                    </div>
                    <div class="panel-card-body">
                        <form th:action="@{/coordinator/appointments/new}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="form-group">
                                <label>Patient</label>
                                <select name="patientId" class="form-control" required>
                                    <option value="">-- Select Patient --</option>
                                    <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName}">Eleanor Vance</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Attending Doctor (Optional)</label>
                                    <select name="doctorId" class="form-control">
                                        <option value="">-- None / N/A --</option>
                                        <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${d.fullName}">Dr. Smith</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Clinical Nutritionist (Optional)</label>
                                    <select name="nutritionistId" class="form-control">
                                        <option value="">-- None / N/A --</option>
                                        <option th:each="n : ${nutritionists}" th:value="${n.id}" th:text="${n.fullName}">Lisa Vance, RD</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Appointment Date</label>
                                    <input type="date" name="appointmentDate" class="form-control" required>
                                </div>
                                <div class="form-group">
                                    <label>Time Slot</label>
                                    <select name="appointmentTime" class="form-control" required>
                                        <option value="09:00 AM">09:00 AM</option>
                                        <option value="10:00 AM">10:00 AM</option>
                                        <option value="11:30 AM">11:30 AM</option>
                                        <option value="02:00 PM">02:00 PM</option>
                                        <option value="03:30 PM">03:30 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Session Type</label>
                                <select name="type" class="form-control" required>
                                    <option value="CHECKUP">General Health Check-up</option>
                                    <option value="DIET_CONSULTATION">Dietary Consultation</option>
                                    <option value="FOLLOWUP">Clinical Follow-up</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label>Coordination Clinical Notes</label>
                                <textarea name="reason" class="form-control" rows="2" placeholder="Clinical purpose, referrals..." required></textarea>
                            </div>

                            <button type="submit" class="btn btn-primary"><i class="fas fa-calendar-check"></i> Book &amp; Notify Patient</button>
                        </form>
                    </div>
                </div>

                <!-- Master Appointments Table -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-list text-success"></i> Clinic Appointments</h3>
                    </div>
                    <div class="panel-card-body">
                        <div class="table-responsive">
                            <table class="app-table">
                                <thead>
                                    <tr>
                                        <th>Date/Time</th>
                                        <th>Patient</th>
                                        <th>Specialist</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="apt : ${appointments}">
                                        <td>
                                            <strong th:text="${apt.appointmentDate}">2026-09-18</strong><br>
                                            <small class="text-muted" th:text="${apt.appointmentTime}">10:00 AM</small>
                                        </td>
                                        <td th:text="${apt.patient.fullName}">Patient</td>
                                        <td>
                                            <span th:if="${apt.doctor != null}" th:text="${'Dr. ' + apt.doctor.fullName}">Doctor</span>
                                            <span th:if="${apt.nutritionist != null}" th:text="${'RD: ' + apt.nutritionist.fullName}">RD</span>
                                        </td>
                                        <td>
                                            <span class="status-badge" th:classappend="${apt.status == 'CONFIRMED' ? 'confirmed' : (apt.status == 'PENDING' ? 'pending' : 'completed')}" th:text="${apt.status}">PENDING</span>
                                        </td>
                                        <td>
                                            <form th:action="@{/coordinator/appointments/status}" method="post" style="display:flex; gap: 4px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <input type="hidden" name="appointmentId" th:value="${apt.id}">
                                                <select name="status" class="form-control" style="width: auto; padding: 2px 4px; font-size: 11px;">
                                                    <option value="CONFIRMED" th:selected="${apt.status == 'CONFIRMED'}">Confirm</option>
                                                    <option value="COMPLETED" th:selected="${apt.status == 'COMPLETED'}">Complete</option>
                                                    <option value="CANCELLED" th:selected="${apt.status == 'CANCELLED'}">Cancel</option>
                                                </select>
                                                <button type="submit" class="btn btn-secondary btn-xs">Set</button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${appointments == null or appointments.isEmpty()}">
                                        <td colspan="5" class="text-center text-muted">No appointments scheduled.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
