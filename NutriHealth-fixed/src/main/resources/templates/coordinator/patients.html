<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Registry – Care Coordinator – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('patients')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Care Coordination</span>
                    <h1 class="page-title">Enrolled Patients Directory</h1>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-users text-primary"></i> Patient Registrations</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Patient Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Status</th>
                                    <th>Dossier Summary</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${patients}">
                                    <td><strong th:text="${p.fullName}">Eleanor Vance</strong></td>
                                    <td th:text="${p.email}">email</td>
                                    <td th:text="${p.phone}">phone</td>
                                    <td><span class="badge badge-success" th:text="${p.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td>
                                    <td>
                                        <a th:href="@{'/reports/patient/' + ${p.id} + '/summary'}" class="btn btn-outline btn-xs" target="_blank">
                                            <i class="fas fa-print"></i> Health Dossier
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${patients == null or patients.isEmpty()}">
                                    <td colspan="5" class="text-center text-muted">No patients registered.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
