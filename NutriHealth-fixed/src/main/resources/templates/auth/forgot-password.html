<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
    <link rel="stylesheet" th:href="@{/css/auth-premium.css}">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <a th:href="@{/}" class="brand-link">
                    <span class="brand-badge"><i class="fas fa-heartbeat"></i></span>
                    <span class="brand-text">Nutri<span class="brand-accent">Health</span></span>
                </a>
                <p class="auth-tagline">Password Recovery Assistance</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i>
                <span th:text="${errorMessage}">Error</span>
            </div>

            <p class="text-muted text-sm" style="margin-bottom: 20px;">
                Enter your registered clinical email address and we will generate a secure one-time password reset credential.
            </p>

            <form th:action="@{/forgot-password}" method="post" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Clinical Email</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="patient@nutrihealth.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-key"></i> Generate Reset Token
                </button>
            </form>

            <div class="auth-footer-text">
                Remember your password? <a th:href="@{/login}">Back to Login</a>
            </div>
        </div>
    </div>
</body>
</html>
