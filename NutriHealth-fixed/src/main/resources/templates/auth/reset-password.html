<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
    <link rel="stylesheet" th:href="@{/css/auth-premium.css}">
</head>
<body class="auth-body">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-brand">
                <a th:href="@{/}" class="brand-link">
                    <span class="brand-badge"><i class="fas fa-heartbeat"></i></span>
                    <span class="brand-text">Nutri<span class="brand-accent">Health</span></span>
                </a>
                <p class="auth-tagline">Set New Security Password</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i>
                <span th:text="${errorMessage}">Error</span>
            </div>

            <form th:action="@{/reset-password}" method="post" class="auth-form">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label for="tokenDisplay"><i class="fas fa-ticket-alt"></i> Reset Authorization Token</label>
                    <input type="text" id="tokenDisplay" class="form-control" th:value="${token}" readonly>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-check-double"></i> Confirm New Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Repeat new password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-save"></i> Update Password &amp; Continue
                </button>
            </form>

            <div class="auth-footer-text">
                <a th:href="@{/login}">Back to Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
