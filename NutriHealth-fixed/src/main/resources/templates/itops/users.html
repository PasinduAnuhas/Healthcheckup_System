<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Accounts Management – IT Ops – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Identity &amp; Access Management</span>
                    <h1 class="page-title">Enterprise User Provisioning</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">User updated!</span>
            </div>

            <div class="dashboard-grid-2">
                <!-- Provision User Form -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-user-plus text-primary"></i> Provision New Account</h3>
                    </div>
                    <div class="panel-card-body">
                        <form th:action="@{/it/users/new}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Username</label>
                                    <input type="text" name="username" class="form-control" placeholder="jdoe" required>
                                </div>
                                <div class="form-group">
                                    <label>Primary Email</label>
                                    <input type="email" name="email" class="form-control" placeholder="jdoe@clinic.org" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Full Legal Name</label>
                                    <input type="text" name="fullName" class="form-control" placeholder="John Doe" required>
                                </div>
                                <div class="form-group">
                                    <label>Initial Password</label>
                                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Phone Number</label>
                                    <input type="text" name="phone" class="form-control" placeholder="+1 (555) 019-2834">
                                </div>
                                <div class="form-group">
                                    <label>Security Role Clearance</label>
                                    <select name="role" class="form-control" required>
                                        <option value="ROLE_PATIENT">Patient</option>
                                        <option value="ROLE_DOCTOR">Doctor (Physician)</option>
                                        <option value="ROLE_NUTRITIONIST">Nutritionist (Dietitian)</option>
                                        <option value="ROLE_COORDINATOR">Care Coordinator</option>
                                        <option value="ROLE_CLINIC_ADMIN">Clinic Administrator</option>
                                        <option value="ROLE_IT_OPERATIONS">IT Operations Officer</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Provision &amp; Activate Account</button>
                        </form>
                    </div>
                </div>

                <!-- Account Directory -->
                <div class="panel-card">
                    <div class="panel-card-header">
                        <h3 class="panel-title"><i class="fas fa-users-cog text-success"></i> Existing User Directory</h3>
                    </div>
                    <div class="panel-card-body">
                        <div class="table-responsive" style="max-height: 520px; overflow-y: auto;">
                            <table class="app-table">
                                <thead>
                                    <tr>
                                        <th>Account</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u : ${users}">
                                        <td>
                                            <strong th:text="${u.fullName}">Name</strong><br>
                                            <small class="text-muted" th:text="${u.email}">email</small>
                                        </td>
                                        <td><span class="badge badge-secondary" th:text="${u.role}">ROLE</span></td>
                                        <td>
                                            <span class="status-badge" th:classappend="${u.active ? 'confirmed' : 'cancelled'}" th:text="${u.active ? 'ACTIVE' : 'LOCKED'}">ACTIVE</span>
                                        </td>
                                        <td>
                                            <form th:action="@{'/it/users/' + ${u.id} + '/toggle-status'}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <button type="submit" class="btn btn-xs" th:classappend="${u.active ? 'btn-danger' : 'btn-success'}"
                                                        th:text="${u.active ? 'Deactivate' : 'Activate'}">
                                                    Toggle
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
