<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointments – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Schedule</span>
                    <h1 class="page-title">Patient Consultations &amp; Check-ups</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">Status updated!</span>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-calendar-check text-primary"></i> Consultation Schedule</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Date &amp; Time</th>
                                    <th>Patient</th>
                                    <th>Type</th>
                                    <th>Reason / Notes</th>
                                    <th>Status</th>
                                    <th>Manage Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="apt : ${appointments}">
                                    <td>
                                        <strong th:text="${apt.appointmentDate}">2026-09-18</strong><br>
                                        <small class="text-muted" th:text="${apt.appointmentTime}">10:00 AM</small>
                                    </td>
                                    <td>
                                        <strong th:text="${apt.patient.fullName}">Patient Name</strong><br>
                                        <small class="text-muted" th:text="${apt.patient.email}">patient@example.com</small>
                                    </td>
                                    <td><span class="badge badge-info" th:text="${apt.type}">CHECKUP</span></td>
                                    <td th:text="${apt.reason}">Reason details</td>
                                    <td>
                                        <span class="status-badge" th:classappend="${apt.status == 'CONFIRMED' ? 'confirmed' : (apt.status == 'PENDING' ? 'pending' : (apt.status == 'COMPLETED' ? 'completed' : 'cancelled'))}" th:text="${apt.status}">PENDING</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/doctor/appointments/{id}/status(id=${apt.id})}" method="post" style="display:flex; gap: 6px;">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                            <input type="hidden" name="appointmentId" th:value="${apt.id}">
                                            <select name="status" class="form-control" style="width: auto; padding: 2px 6px; font-size: 12px;">
                                                <option value="CONFIRMED" th:selected="${apt.status == 'CONFIRMED'}">Confirm</option>
                                                <option value="COMPLETED" th:selected="${apt.status == 'COMPLETED'}">Complete</option>
                                                <option value="CANCELLED" th:selected="${apt.status == 'CANCELLED'}">Cancel</option>
                                            </select>
                                            <button type="submit" class="btn btn-primary btn-xs">Update</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${appointments == null or appointments.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted">No appointments on record.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
