<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Practitioner Credentialing</span>
                    <h1 class="page-title">Physician Profile &amp; Practice Details</h1>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}">Profile saved!</span>
            </div>

            <div class="panel-card" style="max-width: 800px;">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-user-md text-primary"></i> Clinical Credentials</h3>
                </div>
                <div class="panel-card-body">
                    <form th:action="@{/doctor/profile}" method="post">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Doctor Name</label>
                                <input type="text" class="form-control" th:value="${doctor.fullName}" disabled>
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" class="form-control" th:value="${doctor.email}" disabled>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Medical Specialization</label>
                                <input type="text" name="specialization" class="form-control" th:value="${profile.specialization}" required>
                            </div>
                            <div class="form-group">
                                <label>State Medical Board License #</label>
                                <input type="text" name="licenseNumber" class="form-control" th:value="${profile.licenseNumber}" required>
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Hospital Department</label>
                                <input type="text" name="department" class="form-control" th:value="${profile.department}">
                            </div>
                            <div class="form-group">
                                <label>Consultation Room</label>
                                <input type="text" name="consultationRoom" class="form-control" th:value="${profile.consultationRoom}">
                            </div>
                        </div>


                        <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Practice Profile</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
