<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Roster – Dr. Portal – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('patients')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinical Management</span>
                    <h1 class="page-title">Patient Caseload Roster</h1>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-users text-primary"></i> Under Active Care</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Patient Name</th>
                                    <th>Email &amp; Phone</th>
                                    <th>Blood Group</th>
                                    <th>Height / Weight</th>
                                    <th>BMI Score</th>
                                    <th>Allergies &amp; Flags</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${patients}">
                                    <td>
                                        <strong th:text="${p.user.fullName}">Eleanor Vance</strong>
                                    </td>
                                    <td>
                                        <span th:text="${p.user.email}">patient@example.com</span><br>
                                        <small th:text="${p.user.phone}">+1 (555) 019-2834</small>
                                    </td>
                                    <td><span class="badge badge-secondary" th:text="${p.bloodGroup != null ? p.bloodGroup : 'O+'}">O+</span></td>
                                    <td><span th:text="${p.heightCm}">175</span> cm &bull; <span th:text="${p.currentWeightKg}">72.0</span> kg</td>
                                    <td>
                                        <strong th:text="${p.bmi != null ? p.bmi : '23.5'}">23.5</strong>
                                    </td>
                                    <td>
                                        <span class="text-sm text-muted" th:text="${p.allergies != null and !p.allergies.isEmpty() ? p.allergies : 'No known allergies'}">None</span>
                                    </td>
                                    <td>
                                        <a th:href="@{'/doctor/patient/' + ${p.user.id}}" class="btn btn-primary btn-xs">
                                            <i class="fas fa-notes-medical"></i> Open Chart
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${patients == null or patients.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted">No patients assigned yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
