<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients Registry – Admin – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('patients')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinic Administration</span>
                    <h1 class="page-title">Patient Records Directory</h1>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-user-injured text-primary"></i> Enrolled Patients</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Patient Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Registration Date</th>
                                    <th>Status</th>
                                    <th>Dossier</th>
                                <th>Actions</th>
</tr>
                            </thead>
                            <tbody>
                                <tr th:each="p : ${patients}">
                                    <td><strong th:text="${p.fullName}">Eleanor Vance</strong></td>
                                    <td th:text="${p.email}">email</td>
                                    <td th:text="${p.phone}">phone</td>
                                    <td th:text="${p.createdAt}">2026-09-01</td>
                                    <td><span class="badge badge-success" th:text="${p.active ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td>
                                    <td>
                                        <a th:href="@{'/reports/patient/' + ${p.id} + '/summary'}" class="btn btn-outline btn-xs" target="_blank">
                                            <i class="fas fa-print"></i> Health Dossier
                                        </a>
                                    </td>
                                
                                    <td>
                                        <details><summary class="btn btn-secondary btn-xs">Edit / Delete</summary>
                                            <form th:action="@{'/admin/users/' + ${p.id} + '/update'}" method="post" style="margin-top:8px; min-width:250px;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                                <input name="fullName" class="form-control" th:value="${p.fullName}" required>
                                                <input type="email" name="email" class="form-control" th:value="${p.email}" required>
                                                <input name="phone" class="form-control" th:value="${p.phone}">
                                                <input name="address" class="form-control" th:value="${p.address}">
                                                <input name="gender" class="form-control" th:value="${p.gender}">
                                                <input type="hidden" name="role" value="ROLE_PATIENT">
                                                <label><input type="checkbox" name="active" value="true" th:checked="${p.active}"> Active</label><br>
                                                <button type="submit" class="btn btn-primary btn-xs">Save</button>
                                            </form>
                                            <form th:action="@{'/admin/users/' + ${p.id} + '/delete'}" method="post" style="margin-top:6px;" onsubmit="return confirm('Delete this user?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-danger btn-xs">Delete</button></form>
                                        </details>
                                    </td></tr>
                                <tr th:if="${patients == null or patients.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted">No patients registered in clinic database.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
