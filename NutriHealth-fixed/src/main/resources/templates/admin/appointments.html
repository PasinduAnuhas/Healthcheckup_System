<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Appointments – Admin – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('appointments')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Clinic Administration</span>
                    <h1 class="page-title">Master Consultations Audit</h1>
                </div>
            </div>

            <div class="panel-card" style="margin-bottom:24px;">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-plus-circle text-success"></i> Create Appointment</h3>
                </div>
                <div class="panel-card-body">
                    <form th:action="@{/admin/appointments/new}" method="post" class="dashboard-grid-2">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div><label>Patient</label><select name="patientId" class="form-control" required>
                            <option value="">Select patient</option>
                            <option th:each="p : ${patients}" th:value="${p.id}" th:text="${p.fullName + ' (' + p.email + ')'}"></option>
                        </select></div>
                        <div><label>Doctor</label><select name="doctorId" class="form-control">
                            <option value="">Not assigned</option>
                            <option th:each="d : ${doctors}" th:value="${d.id}" th:text="${'Dr. ' + d.fullName}"></option>
                        </select></div>
                        <div><label>Nutritionist</label><select name="nutritionistId" class="form-control">
                            <option value="">Not assigned</option>
                            <option th:each="n : ${nutritionists}" th:value="${n.id}" th:text="${n.fullName}"></option>
                        </select></div>
                        <div><label>Date</label><input type="date" name="appointmentDate" class="form-control" required></div>
                        <div><label>Time</label><input type="text" name="appointmentTime" class="form-control" placeholder="10:00 AM" required></div>
                        <div><label>Type</label><select name="type" class="form-control" required>
                            <option value="GENERAL_CHECKUP">General Checkup</option>
                            <option value="DOCTOR_CONSULTATION">Doctor Consultation</option>
                            <option value="NUTRITION_REVIEW">Nutrition Review</option>
                            <option value="FOLLOW_UP">Follow Up</option>
                        </select></div>
                        <div><label>Status</label><select name="status" class="form-control">
                            <option value="CONFIRMED">CONFIRMED</option><option value="PENDING">PENDING</option>
                        </select></div>
                        <div style="grid-column:1/-1;"><label>Reason</label><textarea name="reason" class="form-control" rows="2" required></textarea></div>
                        <div style="grid-column:1/-1;"><button type="submit" class="btn btn-primary"><i class="fas fa-calendar-plus"></i> Create Appointment</button></div>
                    </form>
                </div>
            </div>

            <div class="panel-card">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-calendar-check text-primary"></i> All Patient Sessions</h3>
                </div>
                <div class="panel-card-body">
                    <div class="table-responsive">
                        <table class="app-table">
                            <thead>
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Patient</th>
                                    <th>Attending Provider</th>
                                    <th>Type</th>
                                    <th>Reason</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="apt : ${appointments}">
                                    <td>
                                        <strong th:text="${apt.appointmentDate}">2026-09-18</strong><br>
                                        <small class="text-muted" th:text="${apt.appointmentTime}">10:00 AM</small>
                                    </td>
                                    <td><strong th:text="${apt.patient.fullName}">Patient</strong></td>
                                    <td>
                                        <span th:if="${apt.doctor != null}" th:text="${'Dr. ' + apt.doctor.fullName}">Doctor</span>
                                        <span th:if="${apt.nutritionist != null}" th:text="${'RD: ' + apt.nutritionist.fullName}">RD</span>
                                    </td>
                                    <td><span class="badge badge-info" th:text="${apt.type}">CHECKUP</span></td>
                                    <td th:text="${apt.reason}">Reason</td>
                                    <td><span class="status-badge" th:classappend="${apt.status == 'CONFIRMED' ? 'confirmed' : 'pending'}" th:text="${apt.status}">CONFIRMED</span></td>
                                    <td><details><summary class="btn btn-secondary btn-xs">Edit / Delete</summary>
                                        <form th:action="@{'/admin/appointments/' + ${apt.id} + '/update'}" method="post" style="margin-top:8px; min-width:260px;"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="date" name="appointmentDate" class="form-control" th:value="${apt.appointmentDate}" required><input name="appointmentTime" class="form-control" th:value="${apt.appointmentTime}" required><input name="type" class="form-control" th:value="${apt.type}" required><textarea name="reason" class="form-control" rows="2" th:text="${apt.reason}" required></textarea><textarea name="notes" class="form-control" rows="2" th:text="${apt.notes}"></textarea><select name="status" class="form-control"><option value="PENDING" th:selected="${apt.status == 'PENDING'}">PENDING</option><option value="CONFIRMED" th:selected="${apt.status == 'CONFIRMED'}">CONFIRMED</option><option value="COMPLETED" th:selected="${apt.status == 'COMPLETED'}">COMPLETED</option><option value="CANCELLED" th:selected="${apt.status == 'CANCELLED'}">CANCELLED</option></select><button type="submit" class="btn btn-primary btn-xs">Save</button></form>
                                        <form th:action="@{'/admin/appointments/' + ${apt.id} + '/delete'}" method="post" style="margin-top:6px;" onsubmit="return confirm('Delete this appointment?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-danger btn-xs">Delete</button></form>
                                    </details></td>
                                </tr>
                                <tr th:if="${appointments == null or appointments.isEmpty()}">
                                    <td colspan="7" class="text-center text-muted">No appointments found.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
