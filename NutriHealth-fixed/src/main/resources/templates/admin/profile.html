<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile – NutriHealth</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/responsive.css}">
    <link rel="stylesheet" th:href="@{/css/light-theme.css}">
</head>
<body class="app-body">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="app-layout">
        <aside th:replace="~{fragments/sidebar :: sidebar('profile')}"></aside>

        <main class="app-main-content">
            <div class="dashboard-page-header">
                <div>
                    <span class="page-category">Executive Credentials</span>
                    <h1 class="page-title">Clinic Administrator Profile</h1>
                </div>
            </div>

            <div class="panel-card" style="max-width: 700px;">
                <div class="panel-card-header">
                    <h3 class="panel-title"><i class="fas fa-user-shield text-primary"></i> Administrator Account</h3>
                </div>
                <div class="panel-card-body">
                    <div class="form-group">
                        <label>Administrator Name</label>
                        <input type="text" class="form-control" th:value="${admin.fullName}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Administrative Email</label>
                        <input type="email" class="form-control" th:value="${admin.email}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Direct Telephone</label>
                        <input type="text" class="form-control" th:value="${admin.phone != null ? admin.phone : '+1 (555) 019-1100'}" disabled>
                    </div>
                    <div class="form-group">
                        <label>Role Clearance</label>
                        <input type="text" class="form-control" value="ROLE_CLINIC_ADMIN (Full Clinical Operations Authority)" disabled>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
